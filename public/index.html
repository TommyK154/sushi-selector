<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="Turn a photo of a sushi menu into a filterable, searchable list of items with ingredients and prices."
    />
    <title>Sushi Selector</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Loaded async; ui.js checks for window.turnstile before using it, so
         a slow or blocked load degrades to a disabled submit button rather
         than a crash. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <main id="app" class="screen">
      <!-- ui.js owns everything inside #app from here; no static markup
           beyond the mount point, per the vanilla-JS/no-framework/no-build
           convention (CLAUDE.md). -->
    </main>

    <script type="module" src="/ui.js"></script>
  </body>
</html>
